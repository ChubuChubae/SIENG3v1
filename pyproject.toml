[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sieng"
version = "3.0.0.dev0"
description = "Steganography Integrated ENGine - adaptive JPEG/PNG steganography with hybrid post-quantum cryptography"
requires-python = ">=3.11"
readme = "README.md"

# Source of truth for dependencies. requirements.txt is generated to match this.
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",

    # D2/D3 closed. 48.0.0 is the first release whose PyPI wheels carry ML-KEM and
    # ML-DSA, because that is where OpenSSL 3.5 became enough. Anything earlier needs a
    # build against AWS-LC or BoringSSL, which is not something to ask a user for.
    "cryptography>=48.0",
    "PyYAML>=6.0",
    "networkx>=3.3",
    "cffi>=1.17",
    "portalocker>=3.0",

    # D1 - JPEG quantized DCT (carrier/image/jpeg.py, Phase 3.3).
    # Swap it out if test_jpeg_roundtrip_is_byte_exact fails.
    "jpeglib>=1.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.7"]
analyzer = ["PyExifTool>=0.5", "hachoir>=3.3", "opencv-python>=4.10", "scikit-image>=0.24"]
research = ["torch>=2.4", "scikit-learn>=1.5", "pandas>=2.2"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100",
    "ruff>=0.6", "mypy>=1.11", "import-linter>=2.0",
    # Local task runner. This project has no hosted CI (PROJECT_CONTEXT.md 2.6).
    "nox>=2024.4",
    "bandit>=1.7", "pip-audit>=2.7", "cyclonedx-bom>=4.6", "detect-secrets>=1.5",
    # Neither of these builds on Windows.
    "semgrep>=1.85; platform_system!='Windows'",
    "atheris>=2.3; platform_system!='Windows'",
]

[project.scripts]
sieng = "sieng.ui.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sieng*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert is how tests are written

[tool.ruff.lint.per-file-ignores]
# Calling external tools is the whole job of noxfile, so S603/S607 are not findings here.
"noxfile.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
# strict is set globally because mypy does not honour it in a per-module section.
# What actually gets checked is decided by the paths noxfile passes: the layers where
# a silent mistake is expensive, plus whatever they import (PROJECT_STRUCTURE.md 9.3).
strict = true

# jpeglib ships no type stubs. Everything we rely on from it is checked at runtime by
# tests/unit/test_jpeg.py instead.
[[tool.mypy.overrides]]
module = ["jpeglib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kat: known answer test, never skip",
    "security: negative security test",
    "slow: takes a while",
]

# Enforces the import matrix in PROJECT_STRUCTURE.md 2.2
[tool.importlinter]
root_package = "sieng"
# Required because the torch contract forbids a package outside the project.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    "sieng.ui",
    "sieng.pipeline",
    "sieng.carrier",
    "sieng.domain",
    "sieng.common",
]

[[tool.importlinter.contracts]]
name = "crypto must be auditable on its own"
type = "forbidden"
source_modules = ["sieng.crypto"]
forbidden_modules = [
    "sieng.ui", "sieng.pipeline", "sieng.carrier",
    "sieng.domain", "sieng.cost", "sieng.coder", "sieng.analyzer",
]

[[tool.importlinter.contracts]]
name = "cost models score numbers and nothing else"
type = "forbidden"
source_modules = ["sieng.cost"]
forbidden_modules = [
    "sieng.ui", "sieng.pipeline", "sieng.carrier",
    "sieng.crypto", "sieng.coder", "sieng.analyzer",
]

[[tool.importlinter.contracts]]
name = "ui never holds raw keys"
type = "forbidden"
source_modules = ["sieng.ui"]
forbidden_modules = ["sieng.crypto", "sieng.coder", "sieng.cost"]
# The ui reaches these only through the composition root, which exists to import every
# implementation and hand back registries. The rule being enforced is that no ui module
# imports them itself, so the container's own wiring is not a violation of it.
# Only edges that actually exist may be listed: an ignore that matches nothing is an
# error. Add the coder line at Phase 8 and the crypto line at Phase 7, when the container
# starts wiring those too.
ignore_imports = ["sieng.app.container -> sieng.cost.*"]

[[tool.importlinter.contracts]]
name = "torch stays out of product code"
type = "forbidden"
source_modules = ["sieng"]
forbidden_modules = ["torch"]
